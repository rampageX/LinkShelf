name: Build and Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 build and native tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish LinkShelf
        shell: pwsh
        run: dotnet publish Source/LinkShelf.csproj -c Release -r win-x64 --self-contained false -o dist

      - name: Publish LinkShelf Mover
        shell: pwsh
        run: dotnet publish Tools/LinkShelfMover/LinkShelfMover.csproj -c Release -r win-x64 --self-contained false -o dist-mover

      - name: Publish and run LinkShelf tests
        shell: pwsh
        run: |
          dotnet publish Source/Tests/LinkShelf.Tests.csproj -c Release -r win-x64 --self-contained false -o dist-tests
          dotnet ./dist-tests/LinkShelf.Tests.dll

      - name: Publish and run Mover native tests
        shell: pwsh
        run: |
          dotnet publish Tools/LinkShelfMover.Tests/LinkShelfMover.Tests.csproj -c Release -r win-x64 --self-contained false -o dist-mover-tests
          dotnet ./dist-mover-tests/LinkShelfMover.Tests.dll

      - name: Package portable ZIP with source
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'LinkShelfPortable'
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          foreach ($file in @('LinkShelf.exe','LinkShelf.dll','LinkShelf.deps.json','LinkShelf.runtimeconfig.json')) {
            Copy-Item -LiteralPath (Join-Path 'dist' $file) -Destination $stage
          }
          foreach ($file in @('LinkShelfMover.exe','LinkShelfMover.dll','LinkShelfMover.deps.json','LinkShelfMover.runtimeconfig.json')) {
            Copy-Item -LiteralPath (Join-Path 'dist-mover' $file) -Destination $stage
          }
          $tests = Join-Path $stage 'Tests'
          New-Item -ItemType Directory -Path $tests -Force | Out-Null
          foreach ($file in @('LinkShelf.Tests.exe','LinkShelf.Tests.dll','LinkShelf.Tests.deps.json','LinkShelf.Tests.runtimeconfig.json')) {
            Copy-Item -LiteralPath (Join-Path 'dist-tests' $file) -Destination $tests
          }
          foreach ($file in @('LinkShelfMover.Tests.exe','LinkShelfMover.Tests.dll','LinkShelfMover.Tests.deps.json','LinkShelfMover.Tests.runtimeconfig.json')) {
            Copy-Item -LiteralPath (Join-Path 'dist-mover-tests' $file) -Destination $tests
          }
          # Mover tests reference the Mover assembly; keep it next to their EXE.
          Copy-Item -LiteralPath 'dist-mover-tests/LinkShelfMover.dll' -Destination $tests
          Copy-Item -LiteralPath 'Tests/Run_Tests.cmd' -Destination $tests
          Copy-Item -LiteralPath 'Tools/LinkShelfMover.Tests/Run_Mover_Tests.cmd' -Destination $tests
          Copy-Item -LiteralPath 'README.txt','README.md','README.en.md','LICENSE','CHANGELOG.md','RELEASE_NOTES.md','THIRD_PARTY_NOTICES.md' -Destination $stage
          Copy-Item -LiteralPath 'Tools/LinkShelfMover/README.md' -Destination (Join-Path $stage 'README_Mover.md')
          $sourceRoot = (Resolve-Path 'Source').Path
          Get-ChildItem -LiteralPath 'Source' -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($sourceRoot, $_.FullName)
              $target = Join-Path (Join-Path $stage 'Source') $relative
              New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
          $toolsRoot = (Resolve-Path 'Tools').Path
          Get-ChildItem -LiteralPath 'Tools' -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](bin|obj)[\\/]' } |
            ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($toolsRoot, $_.FullName)
              $target = Join-Path (Join-Path $stage 'Tools') $relative
              New-Item -ItemType Directory -Path (Split-Path $target) -Force | Out-Null
              Copy-Item -LiteralPath $_.FullName -Destination $target
            }
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'ci' }
          $archive = Join-Path $PWD "LinkShelf_${tag}_Windows_x64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force

      - uses: actions/upload-artifact@v4
        with:
          name: LinkShelf-windows-x64
          path: LinkShelf_*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    # An explicit release commit on master can publish without manually
    # pushing a tag. Regular pushes still only build; tag pushes still work.
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/master' && startsWith(github.event.head_commit.message, 'Release LinkShelf v'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LinkShelf-windows-x64
      - name: Create release or upload asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          shopt -s nullglob
          files=(LinkShelf_*.zip)
          if ((${#files[@]} != 1)); then
            echo "Expected exactly one LinkShelf ZIP" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
            release_tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == 'refs/heads/master' && "$RELEASE_MESSAGE" =~ ^Release[[:space:]]LinkShelf[[:space:]](v[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            release_tag="${BASH_REMATCH[1]}"
            archive="LinkShelf_${release_tag}_Windows_x64.zip"
            mv -- "${files[0]}" "$archive"
            files=("$archive")
          else
            echo "Invalid release trigger" >&2
            exit 1
          fi
          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${files[0]}" --clobber
          else
            gh release create "$release_tag" "${files[0]}" --target "$GITHUB_SHA" --title "LinkShelf $release_tag" --notes-file RELEASE_NOTES.md
          fi
